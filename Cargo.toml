[workspace]
members = [".", "tools/wasm-check"]
resolver = "2"

[package]
name = "grazer"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.90"
description = "A deterministic 2D bullet-hell simulation runtime with Rust, C and WebAssembly interfaces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/myouo/grazer"
readme = "README.md"
keywords = ["gamedev", "stg", "bullet-hell", "deterministic", "wasm"]
categories = ["game-engines", "games", "wasm"]
include = ["/src/**", "/assets/**", "/examples/**", "/include/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/CHANGELOG.md"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
ffi = []
graphics = ["dep:wgpu", "dep:bytemuck"]
resources = ["dep:serde", "dep:serde_json"]
desktop = ["graphics", "resources", "dep:winit", "dep:pollster", "dep:cpal"]
web = ["graphics", "resources", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:console_error_panic_hook"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"], optional = true }
wgpu = { version = "27.0.1", features = ["webgl"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = { version = "0.30.13", optional = true }
pollster = { version = "0.4", optional = true }
cpal = { version = "0.18.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"], optional = true }

[[example]]
name = "desktop"
required-features = ["desktop"]

[[example]]
name = "play"
required-features = ["desktop"]

[[example]]
name = "frame_benchmark"
required-features = ["desktop"]

[[example]]
name = "project"
required-features = ["resources"]

[profile.release]
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
